name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          app_changed=false
          firmware_changed=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            if [[ "$file" == "app/"* || "$file" == ".github/workflows/ci.yml" ]]; then
              app_changed=true
            fi

            if [[ "$file" == "firmware/"* || "$file" == ".github/workflows/ci.yml" ]]; then
              firmware_changed=true
            fi
          done <<< "$changed_files"

          echo "app=$app_changed" >> "$GITHUB_OUTPUT"
          echo "firmware=$firmware_changed" >> "$GITHUB_OUTPUT"

  app-build:
    name: App Build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

  firmware-build:
    name: Firmware Build
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('firmware/platformio.ini', 'firmware/src/**', 'firmware/lib/**', 'firmware/include/**') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: python -m platformio run -d firmware
